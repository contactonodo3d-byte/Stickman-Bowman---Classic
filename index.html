<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stickman Archer</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell"><canvas id="game" aria-label="Stickman Archer game"></canvas><button id="settingsButton" class="settings-button" aria-expanded="false">⚙ Settings</button><button id="matchMenu" class="match-menu">Menu</button><div id="settings" class="settings hidden"><label><input id="windToggle" type="checkbox"> Wind</label><label><input id="wallToggle" type="checkbox"> Random wall</label><label><input id="angleToggle" type="checkbox" checked> Show angle</label><label><input id="powerToggle" type="checkbox" checked> Show power</label></div>
    <section id="menu" class="overlay"><canvas id="menuSky" aria-hidden="true"></canvas><div class="panel"><img class="cover-art" src="cover.svg" alt="Stickman archer drawing a bow"><p class="eyebrow">LOCAL DUEL</p><h1>Stickman<br>Archer</h1><p>Pull away from your shot, then release.</p><button id="resume" hidden>Resume</button><button id="newGame">New Game</button><p class="coming-soon">Coming soon</p><div class="future"><span>Single Player</span><span>Multiplayer</span><span>Options</span></div><aside class="tips"><strong>A little bow wisdom</strong><p id="menuTip" class="rotating-tip">Pull backward to shoot forward.</p></aside></div></section>
    <section id="win" class="overlay hidden"><div class="panel"><p class="eyebrow">DUEL COMPLETE</p><h2 id="winner">P1 WINS</h2><div id="stats" class="stats"></div><aside class="tips end-tips"><strong>One more duel?</strong><p id="endTip" class="rotating-tip">Pull backward to shoot forward.</p></aside><button id="again">Play Again</button><button id="toMenu" class="secondary">Menu</button></div></section>
  </main><script src="game.js"></script>
</body></html>
